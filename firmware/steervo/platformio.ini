; Steervo — ESP32 steer-by-wire controller (pot feedback -> PID -> Talon SRX
; over CTRE CAN, supervised by the Teensy over the same 1 Mbps bus).
;
;   pio run                 -> build the ESP32 image
;   pio test -e native      -> host-side unit tests (no hardware)
;
; Control logic lives in lib/steervo as plain C++ with no Arduino
; dependencies so it runs under the native test environment.

[platformio]
default_envs = esp32dev

[env]
lib_extra_dirs = ../common
build_flags = -Wall -Wextra

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -g -O0
