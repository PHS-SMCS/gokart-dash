; Barebones USB-host enumeration probe for the Teensy 4.1.
; Standalone diagnostic — no kart-core code. Build + flash, watch /dev/ttyACM0.
;   pio run -e teensy41 -t upload     (or flash the .hex via Teensy Loader)
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; -D USBHOST_PRINT_DEBUG: make USBHost_t36 print its enumeration internals
; (connect detection, descriptor reads, driver-claim attempts) to Serial, so we
; can see whether the host detects the wheel at all vs. detects-but-can't-claim.
build_flags = -Wall -D USBHOST_PRINT_DEBUG
