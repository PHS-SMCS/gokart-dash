; SMCS Kart — Teensy 4.1 motion-authority firmware.
;
;   pio run                 -> build the Teensy image
;   pio test -e native      -> host-side unit tests (no hardware)
;
; Safety logic lives in lib/kartcore as plain C++ with no Arduino
; dependencies so it runs under the native test environment.

[platformio]
default_envs = teensy41

[env]
lib_extra_dirs = ../common
build_flags = -Wall -Wextra

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
  https://github.com/tonton81/WDT_T4.git

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=gnu++17 -g -O0
